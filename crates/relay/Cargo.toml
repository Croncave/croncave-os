[package]
name = "croncave-relay"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
croncave-proto = { version = "0.1.0", path = "../proto" }
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[lints]
workspace = true

[dev-dependencies]
tokio-tungstenite = "0.30.0"
