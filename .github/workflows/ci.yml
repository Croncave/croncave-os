name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # scripts/lib.sh starts a private Postgres from these binaries.
      - name: Install Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - name: Install the browser for the end-to-end tests
        run: cd e2e && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Check everything
        run: ./scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
